services:
  postgres:
    image: postgres:16-alpine
    container_name: gogoskola_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gogoskola_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gogoskola_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bun-api:
    build:
      context: ./bun-api
      dockerfile: Dockerfile
    container_name: gogoskola_bun
    profiles:
      - bun
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gogoskola_db
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  dotnet-api:
    build:
      context: ./dotnet-api
      dockerfile: Dockerfile
    container_name: gogoskola_dotnet
    profiles:
      - dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gogoskola_db
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

volumes:
  pgdata:
