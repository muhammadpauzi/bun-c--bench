$kind: http-request
name: Unregistered Column Filter
method: POST
url: '{{baseUrl}}/api/products/search'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "conditions": [
          { "field": "password_hash", "operator": "eq", "value": "secret" }
        ]
      }
    }
