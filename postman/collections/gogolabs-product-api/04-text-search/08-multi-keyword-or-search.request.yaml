$kind: http-request
name: Multi-Keyword OR Search
method: POST
url: '{{baseUrl}}/api/products/search'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "logic": "OR",
        "conditions": [
          { "field": "name", "operator": "ilike", "value": "Asus ROG" },
          { "field": "name", "operator": "ilike", "value": "Lenovo Legion" }
        ]
      },
      "sort": [
        { "field": "price", "order": "asc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 10
      }
    }
