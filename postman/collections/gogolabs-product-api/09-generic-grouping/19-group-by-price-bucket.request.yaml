$kind: http-request
name: Group by Price Range Bucket
method: POST
url: '{{baseUrl}}/api/products/search'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "groupBy": {
        "field": "price",
        "numberBucket": 5000000
      },
      "pagination": {
        "page": 1,
        "limit": 15
      }
    }
