$kind: http-request
name: Group by Timestamp (Month / Day)
method: POST
url: '{{baseUrl}}/api/products/search'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "groupBy": {
        "field": "createdAt",
        "dateTrunc": "month"
      },
      "pagination": {
        "page": 1,
        "limit": 15
      }
    }
