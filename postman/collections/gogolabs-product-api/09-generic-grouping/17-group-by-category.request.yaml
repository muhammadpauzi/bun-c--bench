$kind: http-request
name: Group by Category (with Metadata)
method: POST
url: '{{baseUrl}}/api/products/search'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "conditions": [
          {
            "field": "category.slug",
            "operator": "in",
            "value": ["laptop-komputer", "gadget-smartphone", "buku-pelajaran"]
          }
        ]
      },
      "groupBy": {
        "field": "category.id",
        "labelField": "category.name",
        "metaFields": ["category.slug"]
      },
      "pagination": {
        "page": 1,
        "limit": 15
      }
    }
