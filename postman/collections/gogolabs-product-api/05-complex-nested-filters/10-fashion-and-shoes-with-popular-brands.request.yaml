$kind: http-request
name: Fashion & Shoes with Popular Brands
method: POST
url: '{{baseUrl}}/api/products/search'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "logic": "AND",
        "conditions": [
          {
            "field": "category.slug",
            "operator": "in",
            "value": ["pakaian-pria", "sepatu-sandal"]
          },
          { "field": "price", "operator": "lte", "value": 1000000 },
          {
            "logic": "OR",
            "conditions": [
              { "field": "name", "operator": "ilike", "value": "Nike" },
              { "field": "name", "operator": "ilike", "value": "Adidas" },
              { "field": "name", "operator": "ilike", "value": "Uniqlo" }
            ]
          }
        ]
      },
      "sort": [
        { "field": "price", "order": "asc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 10
      }
    }
