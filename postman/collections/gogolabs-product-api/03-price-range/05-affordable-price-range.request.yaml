$kind: http-request
name: Affordable Price Range
method: POST
url: '{{baseUrl}}/api/products/search'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "logic": "AND",
        "conditions": [
          { "field": "price", "operator": "gte", "value": 50000 },
          { "field": "price", "operator": "lte", "value": 250000 }
        ]
      },
      "sort": [
        { "field": "price", "order": "asc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 10
      }
    }
