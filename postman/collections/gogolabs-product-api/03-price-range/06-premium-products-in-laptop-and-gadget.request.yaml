$kind: http-request
name: 'Premium Products in Laptop & Gadget'
method: POST
url: '{{baseUrl}}/api/products/search'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "logic": "AND",
        "conditions": [
          {
            "field": "category.slug",
            "operator": "in",
            "value": ["laptop-komputer", "gadget-smartphone"]
          },
          { "field": "price", "operator": "gte", "value": 15000000 }
        ]
      },
      "sort": [
        { "field": "price", "order": "desc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 10
      }
    }
