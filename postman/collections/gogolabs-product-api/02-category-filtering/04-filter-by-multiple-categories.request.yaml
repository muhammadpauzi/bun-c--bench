$kind: http-request
name: Filter by Multiple Categories
method: POST
url: '{{baseUrl}}/api/products/search'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "conditions": [
          {
            "field": "category.slug",
            "operator": "in",
            "value": ["laptop-komputer", "gadget-smartphone", "elektronik-rumah"]
          }
        ]
      },
      "sort": [
        { "field": "category.name", "order": "asc" },
        { "field": "price", "order": "desc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 15
      }
    }
