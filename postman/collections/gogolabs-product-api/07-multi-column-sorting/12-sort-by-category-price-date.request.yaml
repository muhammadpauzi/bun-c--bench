$kind: http-request
name: 'Sort by Category, Price, Date'
method: POST
url: '{{baseUrl}}/api/products/search'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "conditions": [
          {
            "field": "category.slug",
            "operator": "in",
            "value": ["makanan-minuman", "olahraga-outdoor", "kecantikan-perawatan"]
          }
        ]
      },
      "sort": [
        { "field": "category.name", "order": "asc" },
        { "field": "price", "order": "desc" },
        { "field": "createdAt", "order": "desc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 12
      }
    }
