$kind: http-request
name: Products Created in Date Range
method: POST
url: '{{baseUrl}}/api/products/search'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "filter": {
        "logic": "AND",
        "conditions": [
          { "field": "createdAt", "operator": "gte", "value": "2026-01-01T00:00:00.000Z" },
          { "field": "createdAt", "operator": "lte", "value": "2026-06-30T23:59:59.999Z" }
        ]
      },
      "sort": [
        { "field": "createdAt", "order": "desc" }
      ],
      "pagination": {
        "page": 1,
        "limit": 10
      }
    }
